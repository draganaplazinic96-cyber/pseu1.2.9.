<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>PSEU — plan učenja · 3–5. septembar</title>
<style>
  :root{
    --bg:#080b14; --bg2:#0d1220; --card:#111830; --border:#233156;
    --accent:#2d5be0; --accent-light:#5b8def; --accent-dim:#1c2c52;
    --gold:#e8c15c; --gold-dim:#7a6a3a;
    --text:#eef1f7; --muted:#8592b0; --warn:#e07a6f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:20px; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(45,91,224,0.16), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 10%, rgba(232,193,92,0.05), transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg) 40%);
    background-attachment:fixed;
    position:relative;
  }
  /* diskretan pozadinski EU motiv */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle at 50% 8%, rgba(232,193,92,0.05) 0, transparent 2px),
      linear-gradient(rgba(120,145,200,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,145,200,0.025) 1px, transparent 1px);
    background-size: auto, 42px 42px, 42px 42px;
    opacity:0.5;
  }
  h1{ display:none; }

  .masthead{
    position:relative; z-index:1;
    text-align:center; font-size:21px; font-weight:800; letter-spacing:.03em;
    color:var(--text); margin-bottom:2px;
  }
  .masthead-sub{
    position:relative; z-index:1;
    text-align:center; font-size:11px; font-weight:600; letter-spacing:.12em;
    color:var(--muted); text-transform:uppercase; margin-bottom:18px;
  }
  .masthead-rule{
    position:relative; z-index:1;
    width:120px; height:1px; margin:0 auto 20px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.7;
  }

  #listWrap{ }
  .daytitle{
    position:relative; z-index:1;
    font-size:13px; font-weight:800; margin:34px 0 14px; padding:16px 46px 16px 18px;
    color:var(--text); background:linear-gradient(135deg, var(--accent-dim), var(--card));
    border:1px solid var(--border); border-left:4px solid var(--gold);
    border-radius:8px; letter-spacing:.02em; text-transform:none;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
  }
  .daytitle::after{
    content:"";
    position:absolute; top:14px; right:16px;
    width:26px; height:26px; border-radius:50%;
    border:1px solid var(--gold-dim);
    background:
      radial-gradient(circle at 50% 15%, var(--gold) 0 8%, transparent 9%),
      radial-gradient(circle at 75% 25%, var(--gold) 0 8%, transparent 9%),
      radial-gradient(circle at 90% 50%, var(--gold) 0 8%, transparent 9%),
      radial-gradient(circle at 75% 75%, var(--gold) 0 8%, transparent 9%),
      radial-gradient(circle at 50% 85%, var(--gold) 0 8%, transparent 9%),
      radial-gradient(circle at 25% 75%, var(--gold) 0 8%, transparent 9%),
      radial-gradient(circle at 10% 50%, var(--gold) 0 8%, transparent 9%),
      radial-gradient(circle at 25% 25%, var(--gold) 0 8%, transparent 9%);
    opacity:0.65;
  }
  .daytitle:first-of-type{ margin-top:0; }
  .phase{
    position:relative; z-index:1;
    margin:18px 0 8px; font-size:11px; font-weight:800; color:var(--accent-light);
    text-transform:uppercase; letter-spacing:.08em; padding:9px 12px;
    background:rgba(45,91,224,0.08); border:1px solid var(--accent-dim); border-radius:4px;
  }
  .phase::before{ content:"★  "; color:var(--gold); }

  .countdown{
    position:relative; z-index:1;
    display:flex; justify-content:center;
    margin-bottom:16px; padding:14px 0 6px;
  }
  .star-ring{
    position:relative;
    width:280px; height:280px;
    display:flex; align-items:center; justify-content:center;
  }
  .star-ring::before{
    content:"";
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 45%, rgba(45,91,224,0.16), transparent 72%);
  }
  .star-ring .star{
    position:absolute; top:50%; left:50%;
    width:22px; height:22px; margin:-11px 0 0 -11px;
    transform: rotate(calc(30deg * var(--i))) translateY(-108px) rotate(calc(-30deg * var(--i)));
    color:var(--gold); font-size:22px; line-height:1; text-align:center;
    text-shadow:0 0 8px rgba(232,193,92,0.55);
  }
  .ring-center{ position:relative; z-index:1; text-align:center; }
  .countdown .time{ font-size:30px; font-weight:800; color:var(--accent-light); font-variant-numeric:tabular-nums; letter-spacing:.02em; text-shadow:0 0 24px rgba(91,141,239,0.35); }
  .countdown .time.warn{ color:var(--warn); text-shadow:0 0 24px rgba(224,122,111,0.35); animation: pulseWarn 1.6s ease-in-out infinite; }
  @keyframes pulseWarn{
    0%,100%{ text-shadow:0 0 18px rgba(224,122,111,0.35); }
    50%{ text-shadow:0 0 34px rgba(224,122,111,0.75); }
  }
  .countdown .now-line{ font-size:11px; margin-top:8px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .countdown .now-line strong{ color:var(--text); }

  .overall{
    position:relative; z-index:1;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:14px;
  }
  .overall-top{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .overall .sub2{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:3px; }
  .overall .num{ font-size:16px; font-weight:800; color:var(--accent-light); }
  .reset-btn{ background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:6px 13px; border-radius:8px; font-size:11px; letter-spacing:.04em; cursor:pointer; text-transform:uppercase; font-weight:600; }
  .reset-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }
  .overall-bar{
    margin-top:12px; height:6px; border-radius:999px; background:rgba(255,255,255,0.05);
    border:1px solid var(--border); overflow:hidden;
  }
  .overall-bar-fill{
    height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--accent-light) 85%, var(--gold));
    transition:width .25s ease;
  }

  .daymeta{ position:relative; z-index:1; font-size:11.5px; color:var(--muted); margin-bottom:8px; }

  .phaseproj{
    position:relative; z-index:1; margin:4px 0 10px; padding:8px 12px;
    background:rgba(232,193,92,0.05); border:1px solid var(--gold-dim); border-radius:8px;
    font-size:11.5px; color:var(--text); display:flex; gap:14px; flex-wrap:wrap;
  }
  .phaseproj b{ color:var(--gold); }
  .phaseproj .pdrift.late{ color:var(--warn); font-weight:700; }
  .phaseproj .pdrift.early{ color:var(--accent-light); font-weight:700; }
  .phaseproj .pdrift.ontime{ color:var(--muted); font-weight:700; }

  .list{ position:relative; z-index:1; display:flex; flex-direction:column; gap:5px; }
  .row{
    display:flex; align-items:center; gap:10px; min-height:38px;
    border-radius:8px; background:var(--card); border:1px solid var(--border); cursor:pointer;
    font-size:13px; user-select:none; padding:7px 11px; transition:background .12s, border-color .12s, color .12s;
  }
  .row:hover{ border-color:var(--accent); }
  .row .row-label{ flex:1; line-height:1.35; }
  .row .row-time{ font-size:10.5px; color:var(--muted); white-space:nowrap; flex-shrink:0;
    background:rgba(255,255,255,0.04); padding:2px 8px; border-radius:999px; }
  .row.checked{ background:linear-gradient(135deg, var(--gold-dim), var(--gold)); color:#1a1608; border-color:var(--gold); }
  .row.checked .row-label{ text-decoration:line-through; font-weight:600; }
  .row.checked .row-time{ background:rgba(0,0,0,0.18); color:inherit; }

  .list{ }
  .subject-block{ margin-bottom:10px; }
  .subject-header{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:9px 12px; margin-bottom:5px; transition:border-color .12s, background .12s;
    user-select:none;
  }
  .subject-header:hover{ border-color:var(--accent); }
  .subject-header.complete{ border-color:var(--gold-dim); background:rgba(232,193,92,0.06); }
  .subject-header.complete .subject-title::before{ content:"★ "; color:var(--gold); }
  .subject-title{ flex:1; font-size:13.5px; font-weight:700; line-height:1.3; }
  .subject-progress{ font-size:10.5px; color:var(--muted); background:rgba(255,255,255,0.04);
    padding:2px 8px; border-radius:999px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .subquestions{ display:flex; flex-direction:column; gap:4px; margin:0 0 4px 10px; border-left:1px solid var(--border); padding-left:8px; }
  .qrow{ font-size:12px; padding:6px 10px; min-height:32px; }

  .actual-row{ display:flex; align-items:center; gap:7px; margin:1px 0 4px 12px; font-size:11px; color:var(--muted); flex-wrap:wrap; }
  .actual-row input[type="number"]{
    background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:3px 6px; font-size:11px; width:56px; font-family:inherit;
  }
  .actual-row input[type="number"]:focus{ outline:none; border-color:var(--accent); }
  .diff-badge{ font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; letter-spacing:.02em; }
  .diff-badge.late{ background:rgba(224,122,111,0.14); color:var(--warn); }
  .diff-badge.early{ background:rgba(232,193,92,0.14); color:var(--gold); }
  .diff-badge.ontime{ background:rgba(91,141,239,0.14); color:var(--accent-light); }
  .roast{ font-size:10.5px; font-style:italic; white-space:normal; }
  .roast.late{ color:var(--warn); }
  .roast.early{ color:var(--gold); }
  .roast.ontime{ color:var(--accent-light); }

  .special-row{ border-left:3px solid var(--gold); }
  .special-row.checked{ border-left-color:#1a1608; }

  .rz-flag{
    cursor:pointer; flex-shrink:0; font-size:12px; line-height:1; padding:3px 6px;
    border-radius:6px; opacity:0.32; transition:opacity .12s, background .12s;
  }
  .rz-flag:hover{ opacity:0.7; background:rgba(224,122,111,0.12); }
  .rz-flag.rz-on{ opacity:1; background:rgba(224,122,111,0.16); }

  .redzone-panel{
    margin:6px 0 8px 12px; padding:10px 12px; border-radius:8px;
    border:1px solid var(--gold-dim); background:rgba(232,193,92,0.04);
  }
  .redzone-header{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;
    font-size:11.5px; margin-bottom:8px; }
  .redzone-header b{ color:var(--gold); }
  .redzone-progress{ color:var(--muted); font-size:11px; white-space:nowrap; }
  .redzone-empty{ font-size:12px; color:var(--muted); font-style:italic; }
  .redzone-list{ display:flex; flex-direction:column; gap:5px; }
  .redzone-qrow{ font-size:12px; }

  .pause{
    display:flex; align-items:center; gap:10px; margin:2px 0 0; color:var(--muted); font-size:11.5px; cursor:pointer;
  }
  .pause::before, .pause::after{ content:""; flex:1; height:1px; background:var(--border); }
  .pause span{ white-space:nowrap; background:rgba(255,255,255,0.02); border:1px dashed var(--border);
    padding:3px 12px; border-radius:999px; transition:background .12s, border-color .12s, color .12s; }
  .pause span::before{ content:"☕ "; opacity:0.6; }
  .pause:hover span{ border-color:var(--gold-dim); }
  .pause.checked span{ background:rgba(232,193,92,0.08); color:var(--gold); border:1px solid var(--gold-dim);
    font-weight:600; text-decoration:line-through; }
  .pause-actual-row{ display:flex; align-items:center; justify-content:center; gap:7px; margin:2px 0 4px; font-size:11px; color:var(--muted); flex-wrap:wrap; }
  .pause-actual-row input[type="number"]{
    background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:3px 6px; font-size:11px; width:56px; font-family:inherit;
  }
  .pause-actual-row input[type="number"]:focus{ outline:none; border-color:var(--accent); }

  .comment-row{ margin:2px 0 4px 0; }
  .comment-input{
    width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:6px 9px; font-size:12px; font-family:inherit; resize:vertical; min-height:32px;
    box-sizing:border-box;
  }
  .comment-input:focus{ outline:none; border-color:var(--accent); }
  .comment-reply{ margin-top:5px; font-size:12px; font-style:italic; color:var(--accent-light); }

  .ontime{ color:var(--accent-light); font-weight:700; }
  .late{ color:var(--warn); font-weight:700; }
  .early{ color:var(--gold); font-weight:700; }

  .interphase{
    position:relative; z-index:1; margin:22px 0; padding:14px 16px;
    border:1px solid var(--gold-dim); border-radius:10px;
    background:rgba(232,193,92,0.06); color:var(--text); text-align:center;
    font-size:12px; font-weight:700; letter-spacing:.03em;
  }
  .interphase .sleep-time{ color:var(--gold); font-size:13px; }

</style>
</head>

const pauseEarlyComments = ["Brzo skratila si pauzu, malo predaha ti neće ništa pokvariti.", "Wow skratila si pauzu, malo predaha ti neće ništa pokvariti.", "Ajme skratila si pauzu, malo predaha ti neće ništa pokvariti.", "Impresivno skratila si pauzu, malo predaha ti neće ništa pokvariti.", "Brzinski skratila si pauzu, malo predaha ti neće ništa pokvariti.", "Munjevito skratila si pauzu, malo predaha ti neće ništa pokvariti.", "Turbo skratila si pauzu, malo predaha ti neće ništa pokvariti.", "Rekordno skratila si pauzu, malo predaha ti neće ništa pokvariti.", "Za dlaku skratila si pauzu, malo predaha ti neće ništa pokvariti.", "Gotovo skratila si pauzu, malo predaha ti neće ništa pokvariti."];
const commentReplies = ["Aha, baš uverljivo, sledeći put probaj bez izgovora, sad nazad na učenje.", "Zvuči, baš uverljivo, sledeći put probaj bez izgovora, sad nazad na učenje.", "Prihvaćeno, baš uverljivo, sledeći put probaj bez izgovora, sad nazad na učenje.", "Lepo, baš uverljivo, sledeći put probaj bez izgovora, sad nazad na učenje.", "Da, da, baš uverljivo, sledeći put probaj bez izgovora, sad nazad na učenje.", "Impresivno, baš uverljivo, sledeći put probaj bez izgovora, sad nazad na učenje.", "Ok, baš uverljivo, sledeći put probaj bez izgovora, sad nazad na učenje.", "Razumem, baš uverljivo, sledeći put probaj bez izgovora, sad nazad na učenje.", "Jasno, baš uverljivo, sledeći put probaj bez izgovora, sad nazad na učenje.", "Kapiram, baš uverljivo, sledeći put probaj bez izgovora, sad nazad na učenje."];

let state = {};
let actualMin = {};
let itemComments = {};
let redZoneState = {};   // global by official question number: { [qNum]: true/false }
let redZoneDone = {};    // global by official question number: { [qNum]: true/false }

const STORAGE_KEY = 'pseuPlannerState';

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      state,
      actualMin,
      itemComments,
      redZoneState,
      redZoneDone
    }));
  } catch(e){
    console.error('Greška pri čuvanju stanja:', e);
  }
}

function loadState(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(!saved) return;
    const data = JSON.parse(saved);
    state = data.state || {};
    actualMin = data.actualMin || {};
    itemComments = data.itemComments || {};
    redZoneState = data.redZoneState || {};
    redZoneDone = data.redZoneDone || {};
  } catch(e){
    console.error('Greška pri učitavanju sačuvanog stanja:', e);
  }
}

function saveAndRender(){
  saveState();
  render();
}

function hashStr(s){
  let h = 0;
  for(let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function pickComment(arr, seed){
  if(!arr || !arr.length) return '';
  return arr[hashStr(String(seed)) % arr.length];
}
function itemComment(cls, seed){
  const map = { late: itemLateComments, ontime: itemOnTimeComments, early: itemEarlyComments };
  return pickComment(map[cls], seed);
}
function pauseComment(cls, seed){
  const map = { late: pauseLateComments, ontime: pauseOnTimeComments, early: pauseEarlyComments };
  return pickComment(map[cls], seed);
}

function minutesLabel(m){
  const neg = m < 0;
  const abs = Math.abs(m);
  const h = Math.floor(abs/60), r = abs%60;
  const str = h > 0 ? (r ? `${h}h ${r}min` : `${h}h`) : `${abs} min`;
  return neg ? `-${str}` : str;
}

function signedMinLabel(m){
  if(m === 0) return "0 min";
  return (m > 0 ? "+" : "\u2212") + Math.abs(m) + " min";
}

function pad2(n){ return String(n).padStart(2,'0'); }
function formatHHMM(date){ return pad2(date.getHours()) + ":" + pad2(date.getMinutes()); }

function diffInfo(planned, actualVal){
  if(actualVal === undefined || actualVal === null || actualVal === '') return null;
  const diff = actualVal - planned;
  if(diff === 0) return { text: "tačno", cls: "ontime", diff: 0 };
  if(diff > 0) return { text: `+${diff} min`, cls: "late", diff };
  return { text: `${diff} min`, cls: "early", diff };
}

function updateActual(key, value){
  if(value !== '' && value !== null){ actualMin[key] = parseInt(value, 10); }
  else { delete actualMin[key]; }
  saveAndRender();
}
function updateItemComment(key, value){
  if(value !== null && value.trim() !== ''){ itemComments[key] = value; }
  else { delete itemComments[key]; }
  saveAndRender();
}

// Parses "N. Naslov oblasti — pitanje1; pitanje2; pitanje3" into
// { title: "N. Naslov oblasti", questions: ["pitanje1", "pitanje2", "pitanje3"] }.
// If there is no " — " separator, the whole label is treated as a single
// item with no sub-questions (rendered the old way).
function parseSubject(label){
  const sep = ' — ';
  const idx = label.indexOf(sep);
  if(idx === -1) return { title: label, questions: [] };
  const title = label.slice(0, idx);
  const rest = label.slice(idx + sep.length);
  const questions = rest.split('|||').map(s => s.trim()).filter(Boolean);
  return { title, questions };
}

function parseQNum(questionText){
  const m = questionText.match(/^(\d+)\./);
  return m ? parseInt(m[1], 10) : null;
}

// Proportional allocation of the fixed 75-minute CRVENA ZONA block across
// whichever official question numbers (1-105) are currently flagged, weighted
// by each question's share of its area's TREĆA FAZA (final repetition) minutes.
// Uses the largest-remainder (Hamilton) method so the total is always exactly 75.
function computeRedZoneAllocation(){
  const RED_ZONE_TOTAL = 50;
  const flagged = Object.keys(redZoneState).filter(k => redZoneState[k]).map(Number).sort((a,b) => a-b);
  if(flagged.length === 0) return { allocations: {}, order: [], total: RED_ZONE_TOTAL, count: 0 };

  const weights = {};
  let totalWeight = 0;
  flagged.forEach(q => {
    const area = QUESTION_AREA[q];
    const w = AREA_FINAL_MIN[area] / AREA_QUESTION_COUNT[area];
    weights[q] = w;
    totalWeight += w;
  });

  const raw = {};
  flagged.forEach(q => { raw[q] = RED_ZONE_TOTAL * weights[q] / totalWeight; });

  const floors = {};
  let flooredSum = 0;
  const remainders = [];
  flagged.forEach(q => {
    const f = Math.floor(raw[q]);
    floors[q] = f;
    flooredSum += f;
    remainders.push([q, raw[q] - f]);
  });
  let remaining = RED_ZONE_TOTAL - flooredSum;
  remainders.sort((a, b) => b[1] - a[1]);
  for(let i = 0; i < remaining; i++){
    floors[remainders[i][0]] += 1;
  }

  return { allocations: floors, order: flagged, total: RED_ZONE_TOTAL, count: flagged.length };
}

function subjectTotals(seq){
  const study = seq.filter(x => x.type === 'item').reduce((a,b) => a + b.min, 0);
  const pause = seq.filter(x => x.type === 'break').reduce((a,b) => a + b.min, 0);
  const special = seq.filter(x => x.type === 'special').reduce((a,b) => a + b.min, 0);
  return { study, pause, special, total: study + pause + special };
}

function computeDrift(seq, dayKey){
  let total = 0, count = 0;
  let ii = -1, bi = -1, si = -1;
  seq.forEach(x => {
    if(x.type === 'item'){
      ii++;
      const key = `${dayKey}-i${ii}`;
      if(actualMin[key] !== undefined){ total += actualMin[key] - x.min; count++; }
    } else if(x.type === 'break'){
      bi++;
      const key = `${dayKey}-b${bi}`;
      if(actualMin[key] !== undefined){ total += actualMin[key] - x.min; count++; }
    } else if(x.type === 'special'){
      si++;
      const key = `${dayKey}-s${si}`;
      if(actualMin[key] !== undefined){ total += actualMin[key] - x.min; count++; }
    }
  });
  return { total, count };
}

function computePhaseProjection(day){
  if(!day.phaseEnd) return null;
  const drift = computeDrift(day.seq, day.key);
  const scheduledEnd = day.phaseEnd;
  const projected = new Date(scheduledEnd.getTime() + drift.total * 60000);
  return {
    scheduledLabel: formatHHMM(scheduledEnd),
    projectedLabel: formatHHMM(projected),
    drift: drift.total,
    count: drift.count
  };
}

function driftHtml(total, count){
  if(count === 0) return '';
  const cls = total === 0 ? 'ontime' : (total > 0 ? 'late' : 'early');
  const label = total === 0 ? 'tačno po planu' : (total > 0 ? `u minusu ${minutesLabel(total)}` : `u plusu ${minutesLabel(-total)}`);
  return `Odstupanje (${count} uneto): <span class="${cls}">${label}</span>`;
}

function renderActualAndComment(container, key, planned){
  const info = diffInfo(planned, actualMin[key]);
  const cmt = info ? itemComment(info.cls, key + ':' + actualMin[key]) : '';
  const actualRow = document.createElement('div');
  actualRow.className = 'actual-row';
  actualRow.innerHTML = `
    <span>Planirano vremena ${planned} · Potrošeno vremena:</span>
    <input type="number" min="0" placeholder="min" value="${actualMin[key] !== undefined ? actualMin[key] : ''}">
    ${info ? `<span class="diff-badge ${info.cls}">${info.text}</span><span class="roast ${info.cls}">${cmt}</span>` : ''}
  `;
  const inp = actualRow.querySelector('input');
  inp.onclick = (e) => e.stopPropagation();
  inp.onchange = (e) => { e.stopPropagation(); updateActual(key, e.target.value); };
  container.appendChild(actualRow);

  const commentRow = document.createElement('div');
  commentRow.className = 'comment-row';
  commentRow.innerHTML = `
    <textarea class="comment-input" placeholder="komentar">${itemComments[key] || ''}</textarea>
    ${itemComments[key] ? `<div class="comment-reply">${pickComment(commentReplies, key + ':' + itemComments[key])}</div>` : ''}
  `;
  const cinp = commentRow.querySelector('textarea');
  cinp.onclick = (e) => e.stopPropagation();
  cinp.onchange = (e) => { e.stopPropagation(); updateItemComment(key, e.target.value); };
  container.appendChild(commentRow);
}

function renderRedZonePanel(container){
  const alloc = computeRedZoneAllocation();
  const panel = document.createElement('div');
  panel.className = 'redzone-panel';

  if(alloc.count === 0){
    panel.innerHTML = `<div class="redzone-empty">Nema označenih pitanja za Crvenu zonu. 75 min ostaje raspoloživa rezerva za blok 06:30–07:45.</div>`;
    container.appendChild(panel);
    return;
  }

  let doneCount = 0;
  alloc.order.forEach(q => { if(redZoneDone[q]) doneCount++; });

  const header = document.createElement('div');
  header.className = 'redzone-header';
  header.innerHTML = `
    <span><b>Crvena zona (06:30–07:45) · ${alloc.count} pitanja · ukupno ${alloc.total} min</b></span>
    <span class="redzone-progress">Završeno: ${doneCount} / ${alloc.count}</span>
  `;
  panel.appendChild(header);

  const list = document.createElement('div');
  list.className = 'redzone-list';
  alloc.order.forEach(q => {
    const text = QUESTION_TEXT[q];
    const mins = alloc.allocations[q];
    const row = document.createElement('div');
    row.className = 'row redzone-qrow' + (redZoneDone[q] ? ' checked' : '');
    row.innerHTML = `<span class="row-label">${text}</span><span class="row-time">${mins} min</span>`;
    row.onclick = () => { redZoneDone[q] = !redZoneDone[q]; saveAndRender(); };
    list.appendChild(row);
  });
  panel.appendChild(list);

  container.appendChild(panel);
}

function renderDay(day){
  const seq = day.seq;
  const wrap = document.createElement('div');

  const title = document.createElement('div');
  title.className = 'daytitle';
  title.textContent = day.label;
  wrap.appendChild(title);

  const tot = subjectTotals(seq);
  const drift = computeDrift(seq, day.key);
  const meta = document.createElement('div');
  meta.className = 'daymeta';
  const specialPart = tot.special > 0 ? ` + ${minutesLabel(tot.special)} crvena zona` : '';
  meta.innerHTML = `Plan: ${minutesLabel(tot.total)} (${minutesLabel(tot.study)} učenje/čitanje + ${minutesLabel(tot.pause)} pauze${specialPart}) · ${driftHtml(drift.total, drift.count)}`;
  wrap.appendChild(meta);

  const proj = computePhaseProjection(day);
  if(proj){
    const pcls = proj.drift === 0 ? 'ontime' : (proj.drift > 0 ? 'late' : 'early');
    const pbox = document.createElement('div');
    pbox.className = 'phaseproj';
    pbox.innerHTML = `
      <span><b>Ovim tempom završavaš u:</b> ${proj.projectedLabel} <span style="color:var(--muted)">(plan: ${proj.scheduledLabel})</span></span>
      <span><b>Odstupanje od predviđenog vremena:</b> <span class="pdrift ${pcls}">${signedMinLabel(proj.drift)}</span></span>
    `;
    wrap.appendChild(pbox);
  }

  const list = document.createElement('div');
  list.className = 'list';
  let ii = -1, bi = -1, si = -1;
  seq.forEach((x) => {
    if(x.type === 'phase'){
      const ph = document.createElement('div');
      ph.className = 'phase';
      ph.textContent = x.label;
      list.appendChild(ph);
    } else if(x.type === 'item'){
      ii++;
      const key = `${day.key}-i${ii}`;
      const parsed = parseSubject(x.label);

      if(parsed.questions.length > 0){
        // Oblast (celina) sa zbirnim vremenom + pojedinačna pitanja za čekiranje
        const block = document.createElement('div');
        block.className = 'subject-block';

        let checkedQ = 0;
        parsed.questions.forEach((q, qi) => { if(state[`${key}-q${qi}`]) checkedQ++; });
        const complete = checkedQ === parsed.questions.length;

        const header = document.createElement('div');
        header.className = 'subject-header' + (complete ? ' complete' : '');
        header.innerHTML = `
          <span class="subject-title">${parsed.title}</span>
          <span class="subject-progress">${checkedQ}/${parsed.questions.length}</span>
          <span class="row-time">${minutesLabel(x.min)}</span>
        `;
        header.onclick = () => {
          const allChecked = parsed.questions.every((q, qi) => state[`${key}-q${qi}`]);
          parsed.questions.forEach((q, qi) => { state[`${key}-q${qi}`] = !allChecked; });
          saveAndRender();
        };
        block.appendChild(header);

        const qlist = document.createElement('div');
        qlist.className = 'subquestions';
        parsed.questions.forEach((q, qi) => {
          const qkey = `${key}-q${qi}`;
          const qNum = parseQNum(q);
          const qrow = document.createElement('div');
          qrow.className = 'row qrow' + (state[qkey] ? ' checked' : '');
          const rzOn = qNum !== null && redZoneState[qNum];
          qrow.innerHTML = `<span class="row-label">${q}</span>` +
            (qNum !== null ? `<span class="rz-flag${rzOn ? ' rz-on' : ''}" title="Označi za crvenu zonu">🔴</span>` : '');
          qrow.onclick = (e) => { e.stopPropagation(); state[qkey] = !state[qkey]; saveAndRender(); };
          if(qNum !== null){
            const flagEl = qrow.querySelector('.rz-flag');
            flagEl.onclick = (e) => {
              e.stopPropagation();
              if(redZoneState[qNum]){
                redZoneState[qNum] = false;
                delete redZoneDone[qNum];
              } else {
                redZoneState[qNum] = true;
              }
              saveAndRender();
            };
          }
          qlist.appendChild(qrow);
        });
        block.appendChild(qlist);

        renderActualAndComment(block, key, x.min);

        list.appendChild(block);
      } else {
        // Stavka bez pitanja ispod (npr. "Samostalni pregled...") — prikaz kao ranije
        const row = document.createElement('div');
        row.className = 'row' + (state[key] ? ' checked' : '');
        row.innerHTML = `<span class="row-label">${x.label}</span><span class="row-time">${minutesLabel(x.min)}</span>`;
        row.onclick = () => { state[key] = !state[key]; saveAndRender(); };
        list.appendChild(row);

        renderActualAndComment(list, key, x.min);
      }
    } else if(x.type === 'break'){
      bi++;
      const key = `${day.key}-b${bi}`;
      const pause = document.createElement('div');
      pause.className = 'pause' + (state[key] ? ' checked' : '');
      pause.innerHTML = `<span>${x.label || 'pauza'} ${x.min} min</span>`;
      pause.onclick = () => { state[key] = !state[key]; saveAndRender(); };
      list.appendChild(pause);

      const info = diffInfo(x.min, actualMin[key]);
      const cmt = info ? pauseComment(info.cls, key + ':' + actualMin[key]) : '';
      const pauseRow = document.createElement('div');
      pauseRow.className = 'pause-actual-row';
      pauseRow.innerHTML = `
        <span>Planirano vremena ${x.min} · Potrošeno vremena:</span>
        <input type="number" min="0" placeholder="min" value="${actualMin[key] !== undefined ? actualMin[key] : ''}">
        ${info ? `<span class="diff-badge ${info.cls}">${info.text}</span><span class="roast ${info.cls}">${cmt}</span>` : ''}
      `;
      const pinp = pauseRow.querySelector('input');
      pinp.onclick = (e) => e.stopPropagation();
      pinp.onchange = (e) => { e.stopPropagation(); updateActual(key, e.target.value); };
      list.appendChild(pauseRow);
    } else if(x.type === 'special'){
      si++;
      const key = `${day.key}-s${si}`;
      const row = document.createElement('div');
      row.className = 'row special-row' + (state[key] ? ' checked' : '');
      row.innerHTML = `<span class="row-label">${x.label}</span><span class="row-time">${minutesLabel(x.min)}</span>`;
      row.onclick = () => { state[key] = !state[key]; saveAndRender(); };
      list.appendChild(row);

      renderActualAndComment(list, key, x.min);

      if(x.redZoneMain){
        renderRedZonePanel(list);
      }
    }
  });
  wrap.appendChild(list);
  return wrap;
}

function render(){
  const container = document.getElementById('listWrap');
  container.innerHTML = '';

  let totalChecked = 0, totalItems = 0;
  DAYS.forEach((day, dayIndex) => {
    container.appendChild(renderDay(day));

    // Spavanje/odmor je između faza, ne pripada nijednoj fazi.
    if(day.key === 'faza1'){
      const sleep = document.createElement('div');
      sleep.className = 'interphase';
      sleep.innerHTML = `<span class="sleep-time">01:54–05:54 · 😴 SPAVANJE — 4h</span>`;
      container.appendChild(sleep);
    } else if(day.key === 'faza2'){
      const sleep = document.createElement('div');
      sleep.className = 'interphase';
      sleep.innerHTML = `<span class="sleep-time">20:30–01:30 · 😴 ODMOR / SPAVANJE DO FAZE 3 — 5h</span>`;
      container.appendChild(sleep);
    }

    let ii = -1;
    day.seq.forEach(x => {
      if(x.type === 'item'){
        ii++;
        const key = `${day.key}-i${ii}`;
        const parsed = parseSubject(x.label);
        if(parsed.questions.length > 0){
          totalItems += parsed.questions.length;
          parsed.questions.forEach((q, qi) => { if(state[`${key}-q${qi}`]) totalChecked++; });
        } else {
          totalItems++;
          if(state[key]) totalChecked++;
        }
      }
    });
  });

  document.getElementById('overallCount').textContent = `${totalChecked} / ${totalItems}`;
  const barFill = document.getElementById('overallBarFill');
  if(barFill){ barFill.style.width = (totalItems > 0 ? (100 * totalChecked / totalItems) : 0) + '%'; }
}

function resetAll(){
  state = {};
  actualMin = {};
  itemComments = {};
  redZoneState = {};
  redZoneDone = {};
  try{
    localStorage.removeItem(STORAGE_KEY);
  } catch(e){
    console.error('Greška pri brisanju sačuvanog stanja:', e);
  }
  render();
}

const examTime = new Date(2026, 8, 5, 9, 0, 0); // 5. septembar 2026, 9:00

function updateCountdown(){
  const now = new Date();
  const nowEl = document.getElementById('nowLine');
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  nowEl.innerHTML = `Sada je: <strong>${hh}:${mm}:${ss}</strong>`;

  const diff = examTime - now;
  const el = document.getElementById('countdownDisplay');
  if(diff <= 0){
    el.textContent = "Ispit je počeo";
    el.classList.add('warn');
    return;
  }
  const totalSeconds = Math.floor(diff/1000);
  const days = Math.floor(totalSeconds / 86400);
  const h = Math.floor((totalSeconds % 86400) / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  const prefix = days > 0 ? `${days}d ` : '';
  el.textContent = `${prefix}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(days < 1 && h < 1) el.classList.add('warn'); else el.classList.remove('warn');
}

loadState();
updateCountdown();
setInterval(updateCountdown, 1000);
render();
</script>
