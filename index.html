function btline(i){const t=state.b[i]||{};let h=`plan <b>${hmP(BRK[i].s)}–${hmP(BRK[i].e)}</b> (${PAUSE} min)`;
 if(t.s)h+=` · počela <b>${clk(t.s)}</b>`;
 if(t.e){const x=durB(i)-PAUSE*60000;h+=` · završila <b>${clk(t.e)}</b> · trajalo <b>${mmss(durB(i))}</b> <span class="${x>60000?'neg':x<-60000?'pos':''}">(${dmin(x)})</span>`}
 else if(t.s)h+=` · <span class="el" data-elb="${i}"></span>`;
 return h}
function editorHTMLB(i){const t=state.b[i]||{};
 return `<div class="ted"><label>Počela <input type="time" step="1" id="edS" value="${t.s?_hms(t.s):''}"></label><label>Završila <input type="time" step="1" id="edE" value="${t.e?_hms(t.e):''}"></label><button class="tbtn go" onclick="saveEdB(${i})">Sačuvaj</button><button class="tbtn rs" style="background:transparent;color:var(--muted);border-color:var(--border)" onclick="cancelEd()">Otkaži</button><span class="edh">prazno polje = nije upisano</span></div>`}
function saveEdB(i){
 const t=state.b[i]||{};
 const s=_parseT(document.getElementById('edS').value,t.s),e=_parseT(document.getElementById('edE').value,t.e);
 if(s===undefined||e===undefined){alert('Vreme upiši kao SS:MM (npr. 23:15).');return}
 if(!s&&e){alert('Upiši i vreme početka.');return}
 if(s&&e&&e<=s){alert('Kraj mora biti posle početka.');return}
 if(!s&&!e)delete state.b[i];else{state.b[i]={s:s};if(e)state.b[i].e=e}
 save();editB=0;render();
}
function breakHTML(i){
 const t=state.b[i]||{},run=t.s&&!t.e,fin=!!t.e;
 let btn=fin?`<button class="tbtn rs" style="background:transparent;color:var(--muted);border-color:var(--border)" onclick="resetB(${i})" title="Poništi">↺</button>`:run?`<button class="tbtn stop" onclick="endB(${i})">Završila pauzu</button>`:`<button class="tbtn go" onclick="startB(${i})">Počela pauzu</button>`;
 btn+=` <button class="tbtn rs" style="background:transparent;color:var(--muted);border-color:var(--border)" title="Upiši vreme ručno" onclick="openEdB(${i})">✎</button>`;
 return `<div class="pause brk-row"><div class="bm"><span>☕ PAUZA ${PAUSE} min</span><div class="tline">${btline(i)}</div>${editB===i+1?editorHTMLB(i):''}${cmHTML('b'+i)}</div><div class="bb">${btn}</div></div>`;
}

const _esc=x=>String(x||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function cmHTML(key){
 const c=state.c[key]||{};
 return `<div class="cm"><input class="cmin" id="cm_${key}" placeholder="Komentar (npr. bilo je teško)…" value="${_esc(c.t)}" oninput="saveDraft('${key}',this.value)" onkeydown="if(event.key==='Enter')sendCm('${key}')"><button class="tbtn cmb" onclick="sendCm('${key}')">Odgovori</button></div><div class="cmrep" id="cr_${key}">${_esc(c.r)}</div>`;
}
function saveDraft(key,v){state.c[key]=state.c[key]||{};state.c[key].t=v;save()}
const CL={
 hard:{y:["Pitanje je zaista među dužim, pa ti verujem. Prolazi bez kazne.","Teško je, a plan ti je dao više minuta, i to opravdava. Gledam kroz prste.","Priznajem, ovo nije lako gradivo. Ovog puta bez prigovora.","Težina je stvarna, a odstupanje razumno. Primljeno.","Ako je pitanje teško, a ti si ga ipak savladala u okvirima plana, to je rezultat, a ne izgovor."],
        n:["Teško je svima, a plan to već uračunava. Odstupanje ostaje na tebi.","Težina nije izgovor kad pitanje nije među dužim. Još jedan minut zaostatka.","„Teško“ je ono što kažemo kad ne želimo da kažemo „odlagala sam“.","Pitanje je obično, a komentar veliki.","Gradivo nije teže od proseka, samo je tvoj tempo sporiji."]},
 tired:{y:["Umor je legitiman razlog, a rezultat je u granicama. Prolazi.","Telo traži svoje, a ti si ipak izdržala. Gledam kroz prste.","Umor je stvaran, a ti si ostala u planu. Tačka.","Za to postoje pauze; ne dugujem ti objašnjenje.","Priznajem umor, rezultat ga ne dokazuje, ali ga ne pobija."],
        n:["Umor nije alibi: sat ne zna za njega.","Umorna si i još kasniš. Umor je objašnjenje, a ne oprost.","Spavanje je zakazano za kasnije, ne za sada.","Umor je stvaran, kašnjenje je stvarno; samo jedno od toga je tvoja odluka.","Telo zna da se umori, a plan ne zna da čeka."]},
 distract:{y:[],n:["Telefon nije otišao sa pitanja, ti si otišla sa pitanja.","Pažnja je resurs, a ti si je dala nekome ko ti ne piše ispit.","Skrolovanje je najskuplja vrsta odlaganja.","Distrakcija je izbor, a ne događaj.","Svet se nije promenio u tih nekoliko minuta; tvoj zaostatak jeste."]},
 needs:{y:["Glad, žeđ i toalet su osnovne potrebe, bez prigovora.","Priznata potreba, nema kazne.","Telo se ne pregovara; vreme se može.","To je opravdano i ne treba ti odobrenje.","Gladna misliteljka ne misli dobro; sve je u redu."],
        n:["Potreba je stvarna, ali trajanje nije bilo samo potrebe.","Kafa ne traje toliko dugo.","Bila je to potreba ili pauza koja se pretvorila u odlaganje?","Jesti treba, ali ne uz zaostatak.","Priznajem potrebu, osporavam dužinu."]},
 easy:{y:["Lako ti je, a i rezultat to pokazuje. Pohvala.","Brzo i tačno: tako to treba.","Kad je lako, ovako i izgleda.","Ako ti je lako, ostaje više vremena. Dobro.","Znanje se vidi u tempu."],
       n:["Lako ti je, a kasniš? Onda problem nije u gradivu.","„Lako“ i „zaostatak“ ne idu zajedno.","Ako je lako, kome duguješ ovo odstupanje?","Lako je ono što kažeš, a ne ono što pokazuje sat.","Lako, a sat se ne slaže."]},
 other:{y:["Primljeno. Rezultat ti ide u prilog, pa ne tražim dalje.","Dobro, prihvatam.","Nema primedbi, brojke su na tvojoj strani.","Ne treba ti opravdanje, plan je ispunjen.","Zabeleženo, bez zamerke."],
        n:["Zabeleženo, ali brojke govore drugačije od komentara.","Objašnjenje ne vraća izgubljeni minut.","Lepo objašnjeno, loše vreme.","Komentar je prihvaćen, odstupanje nije.","Reči nisu minuti."]}
};
function localReply(c,text){
 const t=text.toLowerCase();
 let cat='other';
 if(/te[sšž]k|komplik|ne ide|nejasn|zbunjuj|zamr|mutno|zaglav|ne razum|vrtim|ne pamtim|zaboravlj|dug[oa]|puno/.test(t))cat='hard';
 else if(/umor|pospan|spava|iscrp|oči|glava me/.test(t))cat='tired';
 else if(/telefon|instagram|tiktok|skrol|poruk|društven|zvao|zvala|zvonio|gledala|pričala|razgovar/.test(t))cat='distract';
 else if(/gladn|kafa|kafu|wc|toalet|jela|jesti|piti|voda|cigar|sendvič/.test(t))cat='needs';
 else if(/lak[oa]|brzo|jednostav|znam|ide mi/.test(t))cat='easy';
 const late=c.delta!=null?c.delta>1:c.drift>0.5;
 let ok;
 if(cat==='distract')ok=false;
 else if(cat==='hard')ok=c.planMin>=c.avgMin*1.1||!late||(c.delta!=null&&c.delta<=3);
 else if(cat==='tired')ok=c.kind==='b'||(c.delta!=null&&c.delta<=2)||c.drift<0;
 else if(cat==='needs')ok=c.kind==='b'||!late;
 else ok=!late;
 const pool=CL[cat][ok?'y':'n'].length?CL[cat][ok?'y':'n']:CL[cat].n;
 const used=state.cu=state.cu||[];
 let cand=pool.filter(x=>!used.includes(x));if(!cand.length)cand=pool;
 const line=cand[Math.floor(Math.random()*cand.length)];used.push(line);if(used.length>40)used.shift();
 let extra='';
 if(Math.random()<0.6){extra=' '+pick(ok?'p':'l',c.ai)}
 return line+extra;
}
async function askClaude(c,text){
 try{
  if(!(window.claude&&claude.use))return null;
  const sample=await claude.use('sample');if(!sample)return null;
  const recent=Object.values(state.c).map(x=>x.r).filter(Boolean).slice(-6).join(' | ');
  const stanje=c.delta!=null?`${c.fin?'završeno':'u toku'}, trajalo ${c.act.toFixed(1)} min od planiranih ${c.planMin} min (odstupanje ${c.delta>=0?'+':''}${c.delta.toFixed(1)} min)`:`nije počela, plan ${c.planMin} min`;
  const prompt=`Ti si strog, duhovit i pošten profesor predmeta „${SUBJ}". Studentkinja uči celu noć pred ispit i ostavila je komentar uz ${c.kind==='q'?'pitanje':'pauzu'}.
Pitanje/pauza: ${c.title}
Oblast: ${c.area}
Stanje: ${stanje}. Ukupno u odnosu na plan: ${c.drift>0.5?'kasni '+c.drift.toFixed(1)+' min':c.drift<-0.5?'ispred je '+(-c.drift).toFixed(1)+' min':'na vremenu je'}. Prosečno planirano po pitanju je ${c.avgMin.toFixed(1)} min (ovo pitanje ima ${c.planMin} min, što pokazuje koliko je dugo).
Njen komentar: „${text}“
Zadatak: proceni da li je komentar opravdan. Uzmi u obzir dužinu pitanja prema planu, odstupanje i da li je u pitanju pauza. Ako je opravdan, gledaj joj kroz prste kratko i pošteno, bez laskanja. Ako je izgovor, isprozivaj je britko i duhovito, u filozofskom stilu predmeta i vezano za temu pitanja, bez vulgarnosti i bez pominjanja izgleda ili porodice. Pravila: srpski jezik, ženski rod za nju, 1 do 3 rečenice, ne pitaj kako je, ne daj savete ni naredbe, ne ponavljaj ranije odgovore (${recent||'nema'}). Vrati samo odgovor, bez navodnika.`;
  const r=await sample(prompt,{modelTier:'quick',cache:false});
  return (r&&r.text||'').trim()||null;
 }catch(e){return null}
}
async function sendCm(key){
 const inp=document.getElementById('cm_'+key);if(!inp)return;
 const text=inp.value.trim();if(!text)return;
 state.c[key]=state.c[key]||{};state.c[key].t=text;
 const out=document.getElementById('cr_'+key);if(out)out.textContent='…';
 const c=cmCtx(key);
 let r=await askClaude(c,text);
 if(!r)r=localReply(c,text);
 state.c[key].r=r;save();
 const o2=document.getElementById('cr_'+key);if(o2)o2.textContent=r;
}

const SUBJ='Politički sistem Evropske unije';
const QT={};AREAS.forEach(a=>a[1].forEach(q=>{QT[+qnum(q)]=q}));
function cmCtx(key){
 const kind=key[0],id=+key.slice(1),now=Date.now();
 let title,area,planMin,ai,act=null,fin=false;
 if(kind==='q'){title=QT[id];ai=AREA_OF[id];area=AREAS[ai][0];planMin=PLAN[id].m;const t=state.t[id];if(t&&t.s){fin=!!t.e;act=dur(id)/60000}}
 else{ai=id;title='pauza posle oblasti '+AREAS[id][0];area=AREAS[id][0];planMin=PAUSE;const t=state.b[id];if(t&&t.s){fin=!!t.e;act=durB(id)/60000}}
 return {kind,title,area,ai,planMin,act,fin,delta:act==null?null:act-planMin,drift:drift()/60000,avgMin:MINS.reduce((a,b)=>a+b,0)/MINS.length};
}
function toggleRed(n,e){e.stopPropagation();state.red[n]=!state.red[n];save();render()}
function toggleRed22(n){state.red22[n]=!state.red22[n];save();render()}
function toggleQ22(n){state.d22[n]=!state.d22[n];save();render()}
function showDay(d){state.day=d;save();render()}
function doneCount(day){let c=0;for(let n=1;n<=TOTALQ;n++){if(day===21?(state.t[n]&&state.t[n].e):state.d22[n])c++}return c}
function areaHTML(day,a,ai){
 const nums=a[1].map(q=>qnum(q));
 const dn=nums.filter(n=>day===21?(state.t[n]&&state.t[n].e):state.d22[n]).length;
 const tot=nums.reduce((s,n)=>s+PLAN[+n].m,0);
 let rows=a[1].map(q=>{
  const n=qnum(q);
  if(day===21){
   const t=state.t[n]||{},run=t.s&&!t.e,fin=!!t.e;
   let btn=fin?`<button class="tbtn rs" title="Poništi vreme" onclick="event.stopPropagation();resetQ(${n})">↺</button>`:run?`<button class="tbtn stop" onclick="endQ(${n})">Završila</button>`:`<button class="tbtn go" onclick="startQ(${n})">Počela</button>`;
   return `<div class="q ${fin?'checked':''} ${run?'running':''}"><div class="qm"><div class="ql">${q}</div><div class="tline">${tline(n)}</div>${editN==n?editorHTML(n):''}${cmHTML('q'+n)}</div>${btn}<button class="tbtn rs" style="background:transparent;color:var(--muted);border-color:var(--border)" title="Upiši vreme ručno" onclick="event.stopPropagation();openEd(${n})">✎</button><span class="flag ${state.red[n]?'on':''}" title="Označi za Crvenu zonu ponavljanja" onclick="toggleRed('${n}',event)">🔴</span></div>`;
  }
  return `<div class="q ${state.d22[n]?'checked':''}" onclick="toggleQ22('${n}')"><div class="ql">${q}</div></div>`;
 }).join('');
 return `<div class="area"><div class="ah ${dn===nums.length?'complete':''}"><div class="at">${a[0]}</div><div class="ap">${dn} / ${nums.length}${day===21?` · plan ${tot} min`:''}</div></div><div class="qs">${rows}</div></div>`+(day===21&&BRK[ai]?breakHTML(ai):'');
}
function redZone(){let reds=[];AREAS.forEach(a=>a[1].forEach(q=>{let n=qnum(q);if(state.red[n])reds.push(q)}));return `<div class="redzone"><h3>🔴 CRVENA ZONA</h3>${reds.length?reds.map(q=>{let n=qnum(q);return `<div class="q ${state.red22[n]?'checked':''}" onclick="toggleRed22('${n}')"><div class="ql">${q}</div></div>`}).join(''):`<div class="empty">Ništa nije označeno u prvom prolazu.</div>`}</div>`}
function render(){
 const d=state.day;
 document.getElementById('t21').classList.toggle('on',d===21);document.getElementById('t22').classList.toggle('on',d===22);
 const done=doneCount(d),total=TOTALQ,redCount=Object.values(state.red).filter(Boolean).length;
 let h=`<div class="overall"><div class="top"><div><div class="num">${done} / ${total}${d===21?` · 🔴 ${redCount} u crvenoj zoni`:''}</div></div><button class="reset" onclick="resetAll()">Resetuj sve</button></div><div class="bar"><div class="fill" style="width:${done/total*100}%"></div></div></div>`;
 h+=`<div class="daytitle">${d===21?'PRVI PROLAZ · 20 SATI · POČETAK 21. NOV 20:00 · KRAJ 23. NOV 08:00':'PONAVLJANJE · ISPIT 23. NOV U 10:00'}</div>`;
 if(d===21)h+=`<div class="phase">Počela → Završila · zapinje → 🔴 za ponavljanje (ne ulazi u vreme)</div>`;
 if(d===22){h+=redZone();h+=`<div class="daytitle" style="margin-top:28px">★ FINALNA FAZA ★</div>`;}
 AREAS.forEach((a,i)=>{h+=areaHTML(d,a,i)});
 document.getElementById('app').innerHTML=h;
 tick();paintMsg();
}
let lastKey='';
function tick(){
 const bar=document.getElementById('tbar');
 document.body.style.paddingTop=(bar.offsetHeight+16)+'px';
 const now=Date.now(),dr=document.getElementById('tbDrift'),pz=isPaused();
 document.getElementById('tbWork').innerHTML=`${hmsD(workMs())}<small>radno vreme / 20:00:00</small>`;
 document.getElementById('tbPause').textContent=pz?'▶ Nastavi':'⏸ Pauza';
 const d=drift();
 if(pz){dr.className='tb-drift paused';dr.textContent='PAUZA'}
 else if(d>30000){dr.className='tb-drift late';dr.textContent='Kasniš '+mmss(d)}
 else if(d<-30000){dr.className='tb-drift ahead';dr.textContent='Ispred si '+mmss(d)}
 else{dr.className='tb-drift ok';dr.textContent='Na vremenu'}
 const r=runningN(),nx=nextN(),nowEl=document.getElementById('tbNow');
 if(r){
  const rem=PLAN[r].m*60000-dur(r);
  nowEl.textContent=`Pitanje ${r} · ${rem>=0?'preostalo '+mmss(rem):'prekoračeno '+mmss(rem)} · prošlo ${mmss(dur(r))} od ${PLAN[r].m}:00`;
  document.querySelectorAll('[data-el]').forEach(e=>{const q=+e.dataset.el,rr=PLAN[q].m*60000-dur(q);e.textContent=(rr>=0?'preostalo ':'prekoračeno ')+mmss(rr);const row=e.closest('.q');if(row)row.classList.toggle('late-row',rr<0)});
 }else if(runningB()){
  const i=runningB()-1,rem=PAUSE*60000-durB(i);
  nowEl.textContent=`Pauza ${i+1}/${AREAS.length-1} · `+(rem>=0?'preostalo ':'prekoračeno ')+mmss(rem);
 }else if(nx)nowEl.textContent=`Sledeće: pitanje ${nx} · plan ${PLAN[nx].m} min`;
 else nowEl.textContent='Sva pitanja prvog prolaza su gotova';
 document.querySelectorAll('[data-elb]').forEach(e=>{const q=+e.dataset.elb,rr=PAUSE*60000-durB(q);e.textContent=(rr>=0?'preostalo ':'prekoračeno ')+mmss(rr);e.style.color=rr<0?'#e07a6f':''});
 let key='';
 if(!r&&!pz&&runningB()){const i=runningB()-1,over=durB(i)-PAUSE*60000;if(over>0)key='b'+i+':'+Math.floor(over/300000)}
 if(r&&!pz){const over=dur(r)-PLAN[r].m*60000;if(over>0)key='r'+r+':'+Math.floor(over/300000)}
 if(key&&key!==lastKey){lastKey=key;say(key[0]==='b'?+qnum(AREAS[+key.slice(1).split(':')[0]][1].slice(-1)[0]):r)}
}
setInterval(tick,1000);
function resetAll(){if(confirm('Resetovati sva vremena, crvene oznake i ponavljanje?')){localStorage.removeItem(KEY);state={d22:{},red:{},red22:{},t:{},used:{},pl:[],cmt:null,day:21,b:{},c:{}};render()}}
render();

</script></body></html>
