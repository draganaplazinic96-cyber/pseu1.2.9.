const KEY='pseu_review_sep21_22_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{d21:{},d22:{},red:{},red22:{},pauses:{},day:21};
const breaks=new Set([8,15,17,19,20,21]);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function qnum(q){let m=q.match(/^(\d+)\./);return m?m[1]:q}function checked(day,n){return !!state['d'+day][n]}function toggleQ(day,n){state['d'+day][n]=!state['d'+day][n];save();render()}function toggleRed(n,e){e.stopPropagation();state.red[n]=!state.red[n];save();render()}function toggleRed22(n){state.red22[n]=!state.red22[n];save();render()}function togglePause(day,k){let id=day+'-'+k;state.pauses[id]=!state.pauses[id];save();render()}function showDay(d){state.day=d;save();render()}
function progress(day){let done=0,total=0;AREAS.forEach(a=>a[1].forEach(q=>{total++;if(checked(day,qnum(q)))done++}));return [done,total]}

function redZone(){let reds=[];AREAS.forEach(a=>a[1].forEach(q=>{let n=qnum(q);if(state.red[n])reds.push(q)}));return `<div class="redzone"><h3>🔴 CRVENA ZONA</h3>${reds.length?reds.map(q=>{let n=qnum(q);return `<div class="q ${state.red22[n]?'checked':''}" onclick="toggleRed22('${n}')"><div class="ql">${q}</div></div>`}).join(''):``}</div>${reds.length?pauseHTML(22,'red'):''}`}
